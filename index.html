<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <ul class="navbar-nav">
            <li><a href="index.html" class="nav-link active">Part 1</a></li>
            <li><a href="part2.html" class="nav-link">Part 2</a></li>
            <li><a href="part3.html" class="nav-link">Part 3</a></li>
            <li><a href="part4.html" class="nav-link">Part 4</a></li>
            <li><a href="part5.html" class="nav-link">Part 5</a></li>
        </ul>
    </nav>

    <h3 id="main-heading">Heading</h3>
    <p class="text-content">This is a paragraph with original text.</p>
    <div id="html-container"><span>Original HTML content</span></div>

    <br>
    <button id="btn-change-text">Change Text</button><br>
    <button id="btn-change-html">Change HTML</button><br>
    <button id="btn-change-style">Change Style</button>

    <script>
        $(document).ready(function() {
            console.log("jQuery is ready!");

            $("#btn-change-text").click(function() {
                $(".text-content").text("Text updated using .text()");
            });

            $("#btn-change-html").click(function() {
                $("#html-container").html("<strong>HTML content updated using .html()</strong>");
            });

            $("#btn-change-style").click(function() {
                $("#main-heading").css({
                    "color": "gray",
                    "font-family": "monospace",
                    "font-size": "20px"
                });
                $("p").css("color", "gray");
            });
        });
    </script>
</body>
</html>
