<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <ul class="navbar-nav">
            <li><a href="index.html" class="nav-link">Part 1</a></li>
            <li><a href="part2.html" class="nav-link">Part 2</a></li>
            <li><a href="part3.html" class="nav-link">Part 3</a></li>
            <li><a href="part4.html" class="nav-link active">Part 4</a></li>
            <li><a href="part5.html" class="nav-link">Part 5</a></li>
        </ul>
    </nav>

    <button id="btn-basic-anim">Basic Animation</button>
    <button id="btn-seq-anim">Sequential Animation</button>
    <button id="btn-comb-anim">Combined Animation</button>

    <br><br>
    <div style="height: 350px; position: relative; border: 1px solid #ccc; overflow: hidden;">
        <div id="anim-box" style="width: 60px; height: 60px; background-color: black; position: absolute; top: 20px; left: 20px;"></div>
    </div>

    <script>
        $(document).ready(function() {
            $("#btn-basic-anim").click(function() {
                $("#anim-box").animate({
                    width: "120px",
                    height: "120px",
                    left: "150px"
                }, 600, function() {
                    $(this).animate({
                        width: "60px",
                        height: "60px",
                        left: "20px"
                    }, 400);
                });
            });

            $("#btn-seq-anim").click(function() {
                $("#anim-box")
                    .animate({ left: "250px" }, 500)
                    .animate({ top: "180px" }, 500)
                    .animate({ width: "40px", height: "40px" }, 500)
                    .animate({ left: "20px", top: "20px", width: "60px", height: "60px" }, 500);
            });

            $("#btn-comb-anim").click(function() {
                $("#anim-box").animate({
                    opacity: 0.3,
                    width: "140px",
                    height: "140px",
                    left: "200px",
                    top: "100px"
                }, 800, function() {
                    $(this).animate({
                        opacity: 1,
                        width: "60px",
                        height: "60px",
                        left: "20px",
                        top: "20px"
                    }, 500);
                });
            });
        });
    </script>
</body>
</html>
