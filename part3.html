<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <ul class="navbar-nav">
            <li><a href="index.html" class="nav-link">Part 1</a></li>
            <li><a href="part2.html" class="nav-link">Part 2</a></li>
            <li><a href="part3.html" class="nav-link active">Part 3</a></li>
            <li><a href="part4.html" class="nav-link">Part 4</a></li>
            <li><a href="part5.html" class="nav-link">Part 5</a></li>
        </ul>
    </nav>

    <h3>Add Remove Elements</h3>
    <button id="btn-append">Append Item</button>
    <button id="btn-prepend">Prepend Item</button>
    <button id="btn-remove">Remove Last Item</button>
    <ul id="dynamic-list">
        <li>Default Item 1</li>
    </ul>

    <br>
    <h3>Modifying Attributes</h3>
    <img id="attr-img" src="images/image1.png"><br>
    <button id="btn-change-img">Change Image</button><br><br>
    <a id="attr-link" href="https://google.com" target="_blank">Go to Google</a><br>
    <button id="btn-change-link">Change Link Href</button>

    <br><br>
    <h3>Form Live Interaction</h3>
    <input type="text" id="input-name" placeholder="Enter Name"><br>
    <input type="email" id="input-email" placeholder="Enter Email"><br>
    <div style="background: #eee; padding: 10px; border: 1px solid #ccc; width: 300px;">
        <p>Live Name: <span id="live-name">---</span></p>
        <p>Live Email: <span id="live-email">---</span></p>
    </div>

    <script>
        $(document).ready(function() {
            let itemCounter = 2;
            $("#btn-append").click(function() {
                $("#dynamic-list").append("<li>Appended Item " + itemCounter++ + "</li>");
            });
            $("#btn-prepend").click(function() {
                $("#dynamic-list").prepend("<li>Prepended Item " + itemCounter++ + "</li>");
            });
            $("#btn-remove").click(function() {
                $("#dynamic-list li:last-child").remove();
            });

            $("#btn-change-img").click(function() {
                $("#attr-img").attr("src", "images/image2.png");
            });

            $("#btn-change-link").click(function() {
                $("#attr-link").attr("href", "https://github.com").text("Go to GitHub");
            });

            $("#input-name").on("input", function() {
                $("#live-name").text($(this).val() || "---");
            });
            $("#input-email").on("input", function() {
                $("#live-email").text($(this).val() || "---");
            });
        });
    </script>
</body>
</html>
